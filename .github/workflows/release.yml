name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  TARGET: x86_64-unknown-linux-gnu

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.TARGET }}

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked --bin roadmap --target ${{ env.TARGET }}

      - name: Package
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME}"
          STAGE="dist"
          mkdir -p "${STAGE}"
          cp "target/${TARGET}/release/roadmap" "${STAGE}/roadmap"
          cp LICENSE README.md "${STAGE}/"
          ASSET="roadmap-${VERSION}-${TARGET}.tar.gz"
          tar -czf "${ASSET}" -C "${STAGE}" roadmap LICENSE README.md
          echo "ASSET_PATH=${ASSET}" >> "${GITHUB_ENV}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ASSET_PATH }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
